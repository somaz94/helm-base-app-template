name: Helm Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  helm-lint:
    name: Helm Lint (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `base` has no Argo Rollouts templates, so it lints with one values file.
          - chart: charts/base
            values: |
              charts/base/ci/lint-values.yaml
          - chart: charts/base-aws
            values: |
              charts/base-aws/ci/lint-values.yaml
              charts/base-aws/ci/rollout-values.yaml
          - chart: charts/base-azure
            values: |
              charts/base-azure/ci/lint-values.yaml
              charts/base-azure/ci/rollout-values.yaml
          - chart: charts/base-gcp
            values: |
              charts/base-gcp/ci/lint-values.yaml
              charts/base-gcp/ci/rollout-values.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Helm Kustomize Lint
        uses: somaz94/helm-kustomize-lint-action@v1
        with:
          chart_path: ${{ matrix.chart }}
          # image.tag is REQUIRED per service — these charts deliberately fail to render
          # without it (appVersion is not a fallback). A bare `helm template`, which this
          # action runs by default, therefore cannot be the check. Point it at the chart's
          # own ci/ values instead; that also gives `helm lint --strict` real input to
          # validate against values.schema.json.
          values_files: ${{ matrix.values }}
