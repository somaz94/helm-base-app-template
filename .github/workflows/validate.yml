name: Chart Validation

# Deeper than `helm lint`: renders every chart and has a REAL Kubernetes API server
# validate the result. This is the check that catches a wrong apiVersion, an unknown CRD
# field, or a null where the schema wants an object — none of which `helm lint` sees.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate charts against live API schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          # The script reuses a cluster of this name rather than creating its own.
          cluster_name: chart-validate

      - name: Ensure PyYAML
        run: python3 -c 'import yaml' || pip install --quiet pyyaml

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate
        # --keep: the runner is ephemeral, so tearing the cluster down again is wasted time.
        run: scripts/validate-charts.sh --keep
