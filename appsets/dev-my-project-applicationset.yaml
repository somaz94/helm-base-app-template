apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # {env}-{project}-applicationset. Keep this name and the `environment` parameter below in
  # step: the parameter, not this name, is what names every generated Application, its
  # namespace and its Helm release, so a mismatch here is a lie nothing in the cluster
  # corrects.
  name: dev-my-project-applicationset
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: example-cluster # your cluster name
                  url: https://192.168.1.17:6443 # your cluster url
                  values:
                    project: my-project
                    environment: dev
          - git:
              repoURL: git@gitlab.example.com:example-org/helm-base-app-template.git # your source repo
              revision: HEAD
              # DIRECTORY generator, globbed: every service directory becomes an Application
              # automatically, so adding a service to dev is `mkdir` + a values file, with no
              # edit here. That is the right trade for a low-stakes environment — see the qa
              # appset for the opposite trade.
              #
              # A directory generator matches only the IMMEDIATE children of the glob, so a
              # retired `values/{project}/{service}/_deprecated/` sits one level too deep to be
              # matched and needs no exclude. The prod appset's FILE generator does not get
              # that for free.
              directories:
                - path: values/my-project/*
  template:
    metadata:
      name: '{{values.environment}}-{{values.project}}-{{path.basename}}'
      labels:
        environment: '{{values.environment}}'
        project: '{{values.project}}'
        app-name: '{{path.basename}}'
    spec:
      project: '{{values.project}}'
      source:
        repoURL: git@gitlab.example.com:example-org/helm-base-app-template.git
        targetRevision: HEAD
        path: charts/base
        helm:
          version: v3
          releaseName: '{{values.environment}}-{{values.project}}-{{path.basename}}'
          valueFiles:
            # Relative to `path` above, so ../../ lands back at the repo root.
            - '../../values/{{values.project}}/{{path.basename}}/{{values.environment}}.values.yaml'
      destination:
        server: '{{url}}'
        namespace: '{{values.environment}}-{{values.project}}'
      syncPolicy:
        # Leaf workloads follow git exactly. The control plane above them does not — see
        # bootstrap/apps/appsets-app.yaml for why those layers run prune: false.
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
  # Appset-level sync policy — spec.syncPolicy, NOT the template's spec.syncPolicy above.
  # preserveResourcesOnDeletion defaults to FALSE, which means deleting this ApplicationSet
  # deletes every Application it generated, and with them every running workload. Uncomment
  # only if you want removing this file to leave the apps behind for a manual cleanup.
  # syncPolicy:
  #   preserveResourcesOnDeletion: true
