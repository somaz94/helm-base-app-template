apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # {env}-{project}-applicationset — qa, matching the `environment` parameter below.
  name: qa-my-project-applicationset
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: example-cluster # your cluster name
                  url: https://192.168.1.17:6443 # your cluster url
                  values:
                    project: my-project
                    environment: qa
          - git:
              repoURL: git@gitlab.example.com:example-org/helm-base-app-template.git # your source repo
              revision: HEAD
              # DIRECTORY generator, enumerated: the deliberate opposite of the dev appset's
              # glob. Listing the services means a new `values/{project}/{service}/` directory
              # does NOT reach qa until someone adds it here — the set of things running in a
              # gated environment stays a reviewed git change rather than a side effect of
              # creating a directory. The cost is this list, which drifts if you forget it.
              #
              # Glob for environments you want to grow by themselves, enumerate for the ones
              # that should not.
              directories:
                - path: values/my-project/api
                - path: values/my-project/admin
                - path: values/my-project/worker
  template:
    metadata:
      name: '{{values.environment}}-{{values.project}}-{{path.basename}}'
      labels:
        environment: '{{values.environment}}'
        project: '{{values.project}}'
        app-name: '{{path.basename}}'
    spec:
      project: '{{values.project}}'
      source:
        repoURL: git@gitlab.example.com:example-org/helm-base-app-template.git
        targetRevision: HEAD
        path: charts/base
        helm:
          version: v3
          releaseName: '{{values.environment}}-{{values.project}}-{{path.basename}}'
          valueFiles:
            # Relative to `path` above, so ../../ lands back at the repo root.
            - '../../values/{{values.project}}/{{path.basename}}/{{values.environment}}.values.yaml'
      destination:
        server: '{{url}}'
        namespace: '{{values.environment}}-{{values.project}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
  # Appset-level sync policy — spec.syncPolicy, NOT the template's spec.syncPolicy above.
  # preserveResourcesOnDeletion defaults to FALSE, which means deleting this ApplicationSet
  # deletes every Application it generated, and with them every running workload. Uncomment
  # only if you want removing this file to leave the apps behind for a manual cleanup.
  # syncPolicy:
  #   preserveResourcesOnDeletion: true
