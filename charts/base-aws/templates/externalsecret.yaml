{{- if and .Values.externalSecrets .Values.externalSecrets.enabled }}
# ExternalSecret — pulls secret material from an external store (e.g. AWS Secrets Manager
# via the cluster ClusterSecretStore) into a Kubernetes Secret named "<fullname>-secret".
# The Deployment consumes it through envFrom.secretRef (see deployment.yaml). The CR name,
# the target Secret name, and the Deployment secretRef name all derive from the same
# "base-aws.fullname" helper, so they never drift regardless of fullnameOverride.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "base-aws.fullname" . }}-secret
  annotations:
    # Apply this ExternalSecret one wave BEFORE the Deployment so ESO has materialized the
    # "<fullname>-secret" Secret before the rolling pod mounts it via envFrom.secretRef.
    # ArgoCD waits for this resource to be Healthy (Ready=True / Secret synced) before the
    # default-wave Deployment rolls, closing the CreateContainerConfigError bootstrap window.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "base-aws.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    # Fail loudly at render time rather than emit an invalid (null) CR that auto-sync would
    # leave OutOfSync/Error: name and dataFrom are mandatory once externalSecrets is enabled.
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled is true" (.Values.externalSecrets.secretStoreRef).name }}
    kind: {{ (.Values.externalSecrets.secretStoreRef).kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "base-aws.fullname" . }}-secret
    # Owner: ESO owns the Secret and garbage-collects it when this ExternalSecret is deleted.
    creationPolicy: Owner
  dataFrom:
    {{- required "externalSecrets.dataFrom is required when externalSecrets.enabled is true" .Values.externalSecrets.dataFrom | toYaml | nindent 4 }}
{{- end }}
