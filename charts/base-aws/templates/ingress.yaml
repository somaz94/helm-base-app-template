{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "base-aws.fullname" . }}
  labels:
    {{- include "base-aws.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (.Values.clientVersion) (.Values.clientVersion.main) (.Values.ruleNames) (.Values.ruleNames.main) (.Values.serviceNames) (.Values.serviceNames.main) }}
    {{- if gt (len .Values.clientVersion.main) 0 }}
    alb.ingress.kubernetes.io/conditions.{{ .Values.ruleNames.main }}: |
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"Client-Version","values":{{ toJson .Values.clientVersion.main }}}}]
    alb.ingress.kubernetes.io/actions.{{ .Values.ruleNames.main }}: |
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"{{ .Values.serviceNames.main }}","servicePort":"80","weight":100}]}}
    {{- end }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- /* A rule with no host matches every request — the normal shape when the load
           balancer is reached by IP and there is no DNS name yet. */}}
    - {{ if .host }}host: {{ .host | quote }}
      {{ end }}http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                {{- if .useAnnotation }}
                name: {{ .serviceName | default (include "base-aws.fullname" $) }}
                port:
                  name: use-annotation
                {{- else }}
                name: {{ include "base-aws.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}