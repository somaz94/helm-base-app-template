{{- if and .Values.httproute.enabled .Values.httproute.proxySettingsPolicy.timeout }}
apiVersion: gateway.nginx.org/v1alpha1
kind: ProxySettingsPolicy
metadata:
  name: {{ include "base.fullname" . }}
  labels:
    {{- include "base.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "base.fullname" . }}
  timeout:
    {{- toYaml .Values.httproute.proxySettingsPolicy.timeout | nindent 4 }}
{{- end }}
