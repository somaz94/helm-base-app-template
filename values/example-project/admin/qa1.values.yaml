# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1
# version: "ca550a77"

# Environment setting - automatically injects ENVIRONMENT variable to both main container and init containers
# Example: environment: "staging" will add ENVIRONMENT="staging" to container env vars
environment: "qa"

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: harbor.example.com/example-project/admin
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "91030366"

imageCredentials:
  enabled: true
  registry: https://harbor.example.com
  username: robot$example
  password: <HARBOR_ROBOT_TOKEN>
  name: harbor-robot-secret

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets:
  - name: harbor-robot-secret
# This is to override the chart name.
nameOverride: "qa-example-project-admin"
fullnameOverride: "qa-example-project-admin"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
  targetPort: 3000

# Ingress disabled after Phase 6 cutover (2026-04-17) — NGF owns .66 via ngf-public-h Gateway.
# Legacy fields retained for rollback reference; re-enable only if NGF path is reverted.
ingress:
  enabled: false
  className: "nginx-public-h"
  annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false" # Disable SSL redirection
    nginx.ingress.kubernetes.io/ssl-passthrough: "false" # Disable SSL passthrough
  hosts:
    - host: qa-admin.pm.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: external.example.com  # secondary host
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Gateway API HTTPRoute — sole traffic path after Phase 6 cutover (2026-04-17, .66 swap complete).
# sectionName omitted → auto-attach to both HTTP and HTTPS listeners.
# backendRefs omitted → chart auto-wires to the release's Service at service.port.
httproute:
  enabled: true
  parentRefs:
    - name: ngf-public-h
      namespace: nginx-gateway
  hostnames:
    - qa-admin.pm.example.com
    - external.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

revisionHistoryLimit: 1

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

strategy:
  enabled: false
  config:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # Maximum number of pods that can be created above the desired number of pods
      maxUnavailable: "50%" # Maximum number of unavailable pods during the update

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
startupProbe: {}
# livenessProbe: {}
livenessProbe:
  httpGet:
    path: /health
    port: http
# readinessProbe: {}
readinessProbe:
  httpGet:
    path: /health
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

rbac:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

envConfig:
  {}
  # NODE_ENV: base

configs:
  enabled: true
  items:
    - name: qa-admin-app-config
      datas:
        NODE_ENV: qa
        SERVER_PORT: 3000

        # REDIS_HOST: qa-example-project-redis.example-project-db-redis.svc.example-cluster.local
        REDIS_HOST: valkey-redis.example-project-db-redis.svc.example-cluster.local
        REDIS_PORT: 6379
        REDIS_NUMBER: 0

        ADMIN_DB_TYPE: mysql
        ADMIN_DB_HOST: example-project-db.example-project-db-redis.svc.example-cluster.local
        ADMIN_DB_PORT: 3306
        ADMIN_DB_NAME: admin
        ADMIN_DB_DATABASE: qa_admin
        ADMIN_DB_USER: example-project
        ADMIN_DB_PASSWORD: exampleAdminPassword

        COMMON_DB_TYPE: mysql
        COMMON_DB_HOST: example-project-db.example-project-db-redis.svc.example-cluster.local
        COMMON_DB_PORT: 3306
        COMMON_DB_NAME: common
        COMMON_DB_DATABASE: qa_common
        COMMON_DB_USER: example-project
        COMMON_DB_PASSWORD: exampleAdminPassword

        GAME_DB_TYPE: mysql
        GAME_DB_HOST: example-project-db.example-project-db-redis.svc.example-cluster.local
        GAME_DB_PORT: 3306
        GAME_DB_NAME: game
        GAME_DB_DATABASE: qa_game
        GAME_DB_USER: example-project
        GAME_DB_PASSWORD: exampleAdminPassword

# Init Containers Setting
initContainers:
  enabled: false

emptyDirVolumes:
  enabled: false

persistentVolumes:
  enabled: true
  items:
    - name: qa-example-project-admin-app-data-pv
      storage: 5Gi
      volumeMode: Filesystem
      accessModes:
        - ReadWriteMany
      reclaimPolicy: Retain
      storageClassName: nfs-client-nopath
      path: /volume1/nfs/example-project/qa/server/data
      server: 192.168.1.5
    - name: qa-example-project-admin-app-version-pv
      storage: 5Gi
      volumeMode: Filesystem
      accessModes:
        - ReadWriteMany
      reclaimPolicy: Retain
      storageClassName: nfs-client-nopath
      path: /volume1/nfs/example-project/qa/server/version
      server: 192.168.1.5

persistentVolumeClaims:
  enabled: true
  items:
    - name: qa-example-project-admin-app-data-pvc
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nopath
      storage: 5Gi
      mountPath: /app/data
      selector:
        volumeName: qa-example-project-admin-app-data-pv
    - name: qa-example-project-admin-app-version-pvc
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nopath
      storage: 5Gi
      mountPath: /app/version
      selector:
        volumeName: qa-example-project-admin-app-version-pv

# Extra volumes to add to the deployment
extraVolumes: []

# Extra volume mounts to add to the container
extraVolumeMounts: []

# AWS
certificate:
  enabled: false

certCleanup:
  enabled: false
