  #     accessModes:
  #       - ReadWriteMany
  #     reclaimPolicy: Retain
  #     storageClassName: nfs-client-nopath
  #     path: /volume1/nfs/example-project/dev/server/version
  #     server: 192.168.1.5

persistentVolumeClaims:
  enabled: false
  # items:
  #   - name: dev-example-project-app-admin-app-data-pvc
  #     accessModes:
  #       - ReadWriteMany
  #     storageClassName: nfs-client-nopath
  #     storage: 5Gi
  #     mountPath: /app/data
  #     selector:
  #       volumeName: dev-example-project-app-admin-app-data-pv
  #   - name: dev-example-project-app-admin-app-version-pvc
  #     accessModes:
  #       - ReadWriteMany
  #     storageClassName: nfs-client-nopath
  #     storage: 5Gi
  #     mountPath: /app/version
  #     selector:
  #       volumeName: dev-example-project-app-admin-app-version-pv

# Extra volumes to add to the deployment
extraVolumes: []

# Extra volume mounts to add to the container
extraVolumeMounts: []

# AWS
certificate:
  enabled: false
  
certCleanup:
  enabled: false


