# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1
# version: 3ccee4da

# Environment setting - automatically injects ENVIRONMENT variable to both main container and init containers
# Example: environment: "staging" will add ENVIRONMENT="staging" to container env vars
environment: "dev" 

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: harbor.example.com/example-project/battle
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "9e3e488f"

imageCredentials:
  enabled: false
  registry: https://harbor.example.com
  username: robot$example
  password: <HARBOR_ROBOT_TOKEN>
  name: harbor-robot-secret

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: 
  - name: harbor-robot-secret
# This is to override the chart name.
nameOverride: "dev-example-project-battle"
fullnameOverride: "dev-example-project-battle"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations:
  filebeat/logs: "true"
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
  targetPort: 8081

# Ingress disabled after Phase 6 cutover (2026-04-17) — NGF owns .55 via ngf Gateway.
# Legacy fields retained for rollback reference; re-enable only if NGF path is reverted.
ingress:
  enabled: false
  className: "nginx"
  annotations: 
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"   # Disable SSL redirection
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"      # Disable SSL passthrough
  hosts:
    - host: dev-battle.pm.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Gateway API HTTPRoute — sole traffic path after Phase 6 cutover (2026-04-17, .55 swap complete).
# sectionName omitted → auto-attach to both HTTP and HTTPS listeners.
# backendRefs omitted → chart auto-wires to the release's Service at service.port.
httproute:
  enabled: true
  parentRefs:
    - name: ngf
      namespace: nginx-gateway
  hostnames:
    - dev-battle.pm.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

revisionHistoryLimit: 1

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

strategy:
  enabled: false
  config:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1    # Maximum number of pods that can be created above the desired number of pods
      maxUnavailable: "50%"  # Maximum number of unavailable pods during the update

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
startupProbe: {}
# livenessProbe: {}
livenessProbe:
  httpGet:
    path: /health
    port: http 
# readinessProbe: {}
readinessProbe:
  httpGet:
    path: /health
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

rbac:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

envConfig: {}

configs:
  enabled: true
  items:
    - name: dev-battle-app-config
      datas:
        ASPNETCORE_ENVIRONMENT: dev
        SERVER_PORT: 8081
        # REDIS_DB_HOST: example-cluster.example.com
        # REDIS_DB_PORT: 30479
        REDIS_DB_HOST: dev-example-project-redis.example-project-db-redis.svc.example-cluster.local
        REDIS_DB_PORT: 6379

# Init Containers Setting
initContainers:
  enabled: false

emptyDirVolumes:
  enabled: false


persistentVolumes:
  enabled: true
  items:
    - name: dev-example-project-battle-app-data-pv
      storage: 5Gi
      volumeMode: Filesystem
      accessModes:
        - ReadWriteMany
      reclaimPolicy: Retain
      storageClassName: nfs-client-nopath
      path: /volume1/nfs/example-project/dev/server/data
      server: 192.168.1.5
    - name: dev-example-project-battle-app-logs-pv
      storage: 5Gi
      volumeMode: Filesystem
      accessModes:
        - ReadWriteMany
      reclaimPolicy: Retain
      storageClassName: nfs-client-nopath
      path: /volume1/nfs/example-project/dev/server/logs/battle
      server: 192.168.1.5
    # - name: dev-example-project-battle-app-version-pv
    #   storage: 5Gi
    #   volumeMode: Filesystem
    #   accessModes:
    #     - ReadWriteMany
    #   reclaimPolicy: Retain
    #   storageClassName: nfs-client-nopath
    #   path: /volume1/nfs/example-project/dev/server/version
    #   server: 192.168.1.5

persistentVolumeClaims:
  enabled: true
  items:
    - name: dev-example-project-battle-app-data-pvc
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nopath
      storage: 5Gi
      mountPath: /app/data
      selector:
        volumeName: dev-example-project-battle-app-data-pv
    - name: dev-example-project-battle-app-logs-pvc
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nopath
      storage: 5Gi
      mountPath: /app/logs/battle
      selector:
        volumeName: dev-example-project-battle-app-logs-pv
    # - name: dev-example-project-battle-app-version-pvc
    #   accessModes:
    #     - ReadWriteMany
    #   storageClassName: nfs-client-nopath
    #   storage: 5Gi
    #   mountPath: /app/version
    #   selector:
    #     volumeName: dev-example-project-battle-app-version-pv

# Extra volumes to add to the deployment
extraVolumes: []

# Extra volume mounts to add to the container
extraVolumeMounts: []

# AWS
certificate:
  enabled: false
  
certCleanup:
  enabled: false



