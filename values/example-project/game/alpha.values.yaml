# Default values for base-aws.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 2
# version: 6b7ccc64

clientVersion:
  # multiple main versions for A/B testing ex. main: ["0.0.1", "0.1.0", "0.0.2"], single main versions for A/B testing: ex. main: ["0.0.1"]
  main: ["0.1.0", "0.1.1"]
  review: ["0.1.2"]

# Service names as variables
serviceNames:
  main: "alpha-tertiary-project-game"
  review: "review-tertiary-project-game"

# Rule names as variables
ruleNames:
  main: "rule-alpha-tertiary-project-game"
  review: "rule-alpha-tertiary-project-game-review"

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/tertiary-project/game
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "9a4c25fc"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: "alpha-tertiary-project-game"
fullnameOverride: "alpha-tertiary-project-game"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
  targetPort: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Ingress Group - share a single ALB
    alb.ingress.kubernetes.io/group.name: tertiary-project-shared-alb
    alb.ingress.kubernetes.io/group.order: "3" # Configurable 1-1000, lower number = higher priority
    # Add health check path setting
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # # Multi-version support example: ["0.1.0","0.1.1","0.1.2"], switched to template dynamic handling
    # alb.ingress.kubernetes.io/conditions.rule-alpha-tertiary-project-game: |
    #   [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"Client-Version","values":["0.0.1","0.1.0"]}}]
    # alb.ingress.kubernetes.io/actions.rule-alpha-tertiary-project-game: |
    #   {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"alpha-tertiary-project-game","servicePort":"80","weight":100}]}}
    # Additional ALB settings
    alb.ingress.kubernetes.io/load-balancer-name: tertiary-project-shared-alb-loadbalancer
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]' # HTTP removed (CDN Origin is HTTPS only)
    # ACM certificate settings (for ALB - eu-central-1)
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:123456789012:certificate/d434dcb4-1906-450c-9573-9a58929ac5b3
    # CDN optimization settings
    alb.ingress.kubernetes.io/target-group-attributes: |
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=false
    # Origin identification tag
    alb.ingress.kubernetes.io/tags: "Purpose=CDN-Origin"
  hosts:
    - host: alpha-game.tertiary-project.example.com # Domain CloudFront passes in the Host header
      paths:
        - path: /
          pathType: Prefix
          useAnnotation: true
          serviceName: rule-alpha-tertiary-project-game

# Review Ingress settings (for Mac review)
ingressReview:
  enabled: false # Change to true only when needed
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Ingress Group - share a single ALB
    alb.ingress.kubernetes.io/group.name: tertiary-project-shared-alb
    alb.ingress.kubernetes.io/group.order: "4" # health(1), api-docs(2), main(3), review(4)
    # Add health check path setting
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # # Review (for iOS review), switched to template dynamic handling
    # alb.ingress.kubernetes.io/conditions.rule-alpha-tertiary-project-game-review: |
    #   [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"Client-Version","values":["0.1.1"]}}]
    # alb.ingress.kubernetes.io/actions.rule-alpha-tertiary-project-game-review: |
    #   {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"review-tertiary-project-game","servicePort":"80","weight":100}]}}
    # ALB common settings
    alb.ingress.kubernetes.io/load-balancer-name: tertiary-project-shared-alb-loadbalancer
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:123456789012:certificate/d434dcb4-1906-450c-9573-9a58929ac5b3
    alb.ingress.kubernetes.io/target-group-attributes: |
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=false
    alb.ingress.kubernetes.io/tags: "Purpose=CDN-Origin"
  hosts:
    - host: alpha-game.tertiary-project.example.com
      paths:
        - path: /
          pathType: Prefix
          useAnnotation: true
          serviceName: rule-alpha-tertiary-project-game-review

# Health Ingress settings
ingressHealth:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Ingress Group - share a single ALB
    alb.ingress.kubernetes.io/group.name: tertiary-project-shared-alb
    alb.ingress.kubernetes.io/group.order: "1" # High priority (takes precedence over existing)
    # Add health check path setting
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # Health check access (no header condition)
    alb.ingress.kubernetes.io/conditions.rule-alpha-health: |
      [{"field":"path-pattern","pathPatternConfig":{"values":["/health*"]}}]
    alb.ingress.kubernetes.io/actions.rule-alpha-health: |
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"alpha-tertiary-project-game","servicePort":"80","weight":100}]}}
    # ALB common settings
    alb.ingress.kubernetes.io/load-balancer-name: tertiary-project-shared-alb-loadbalancer
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:123456789012:certificate/d434dcb4-1906-450c-9573-9a58929ac5b3
    alb.ingress.kubernetes.io/target-group-attributes: |
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=false
    alb.ingress.kubernetes.io/tags: "Purpose=CDN-Origin"
  hosts:
    - host: alpha-game.tertiary-project.example.com
      paths:
        - path: /health
          pathType: Prefix
          useAnnotation: true
          serviceName: rule-alpha-health

# API Docs Ingress settings
ingressApiDocs:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Ingress Group - share a single ALB
    alb.ingress.kubernetes.io/group.name: tertiary-project-shared-alb
    alb.ingress.kubernetes.io/group.order: "2" # Second priority
    # Add health check path setting
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # API docs access (no header condition)
    alb.ingress.kubernetes.io/conditions.rule-alpha-apidocs: |
      [{"field":"path-pattern","pathPatternConfig":{"values":["/api-docs*"]}}]
    alb.ingress.kubernetes.io/actions.rule-alpha-apidocs: |
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"alpha-tertiary-project-game","servicePort":"80","weight":100}]}}
    # ALB common settings
    alb.ingress.kubernetes.io/load-balancer-name: tertiary-project-shared-alb-loadbalancer
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:123456789012:certificate/d434dcb4-1906-450c-9573-9a58929ac5b3
    alb.ingress.kubernetes.io/target-group-attributes: |
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=false
    alb.ingress.kubernetes.io/tags: "Purpose=CDN-Origin"
  hosts:
    - host: alpha-game.tertiary-project.example.com
      paths:
        - path: /api-docs
          pathType: Prefix
          useAnnotation: true
          serviceName: rule-alpha-apidocs

revisionHistoryLimit: 1

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # Alpha test environment - 100 concurrent users, 2 replicas baseline
  limits:
    cpu: 2000m # 2 CPU core
    memory: 4Gi # 4GB RAM
  requests:
    cpu: 100m # 0.5 CPU core
    memory: 2Gi # 2GB RAM

strategy:
  enabled: true
  config:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # Maximum number of pods that can be created above the desired number of pods
      maxUnavailable: 1 # Maximum number of unavailable pods during the update

# Probe order: Startup → (Liveness + Readiness in parallel)
# Startup succeeds → Liveness/Readiness start. Startup fails → container restarts (no Liveness/Readiness runs).
# Liveness fails → container restarts. Readiness fails → traffic blocked (no restart).
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30 # 5s × 30 = max 150s wait (EFS mount delay)
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

rbac:
  enabled: false

nodeSelector:
  eks.amazonaws.com/nodegroup: example-nodegroup

tolerations: []

affinity: {}

envConfig:
  {}
  # NODE_ENV: base

configs:
  enabled: true
  items:
    - name: alpha-game-app-config
      datas:
        NODE_ENV: alpha
        SERVER_PORT: 8080
        ALLOW_JSON_CONTENT_TYPE: false

        # pub/sup Redis
        REDIS_HOST: alpha-tertiary-project-redis.tertiary-project.svc.cluster.local
        REDIS_PORT: 6379
        REDIS_NUMBER: 0

        # Session Redis
        SESSION_REDIS_HOST: master.alpha-tertiary-project-redis.example.euc1.cache.amazonaws.com
        SESSION_REDIS_PORT: 6379
        SESSION_REDIS_NUMBER: 0
        SESSION_REDIS_CLUSTER_MODE: false
        SESSION_REDIS_TTL: 0

        # User Level Lock redis
        USER_LEVEL_LOCK_ENABLED: true
        RED_LOCK_REDIS_HOST: master.alpha-tertiary-project-redis.example.euc1.cache.amazonaws.com
        RED_LOCK_REDIS_PORT: 6379
        RED_LOCK_REDIS_NUMBER: 0
        RED_LOCK_REDIS_CLUSTER_MODE: false

        COMMON_DB_TYPE: mysql
        COMMON_DB_HOST: alpha-tertiary-project-rds-aurora.cluster-examplecluster.eu-central-1.rds.amazonaws.com
        # COMMON_DB_HOST: example-cluster.example.com
        COMMON_DB_PORT: 3306
        # COMMON_DB_PORT: 30636
        COMMON_DB_NAME: common
        COMMON_DB_DATABASE: alpha_common
        COMMON_DB_USER: example-project
        COMMON_DB_PASSWORD: exampleAdminPassword
        GAME_DB_TYPE: mysql
        GAME_DB_HOST: alpha-tertiary-project-rds-aurora.cluster-examplecluster.eu-central-1.rds.amazonaws.com
        # GAME_DB_HOST: example-cluster.example.com
        GAME_DB_PORT: 3306
        # GAME_DB_PORT: 30636
        GAME_DB_NAME: game
        GAME_DB_DATABASE: alpha_game
        GAME_DB_USER: example-project
        GAME_DB_PASSWORD: exampleAdminPassword
        CHECK_VERSION: false
        CHECK_REQUEST_SEQUENCE: false
        BATTLE_SERVER_URL: http://alpha-tertiary-project-battle.tertiary-project.svc.cluster.local # <svc.name>.<namespace>.svc.<cluster_dns> current cluster dns = cluster.local

# Additional volumes on the output Deployment definition.
volumes: []
