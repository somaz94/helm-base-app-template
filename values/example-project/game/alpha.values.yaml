# EFS settings
efs:
  persistentVolumes:
    enabled: true
    items:
      - name: "alpha-tertiary-project-game-app-data-pv"
        fileSystemId: "fs-0d40ed2fdfb55549b"
        accessPointId: "fsap-006177dc6c6c8d87c" # Access Point ID created by Terraform
        storage: "5Gi"
        volumeMode: Filesystem
        accessModes:
          - ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: "efs-sc"
      - name: "alpha-tertiary-project-game-app-logs-pv"
        fileSystemId: "fs-0d40ed2fdfb55549b"
        accessPointId: "fsap-0c721190faa15a93b" # Access Point ID created by Terraform
        storage: "5Gi"
        volumeMode: Filesystem
        accessModes:
          - ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: "efs-sc"
      - name: "alpha-tertiary-project-game-app-version-pv"
        fileSystemId: "fs-0d40ed2fdfb55549b"
        accessPointId: "fsap-0e54ebb91ce5c57a0" # Access Point ID created by Terraform
        storage: "5Gi"
        volumeMode: Filesystem
        accessModes:
          - ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: "efs-sc"

  persistentVolumeClaims:
    enabled: true
    items:
      - name: "alpha-tertiary-project-game-app-data-pvc"
        accessModes:
          - ReadWriteMany
        storageClassName: "efs-sc"
        storage: "5Gi"
        mountPath: "/app/data"
        selector:
          volumeName: "alpha-tertiary-project-game-app-data-pv"
      - name: "alpha-tertiary-project-game-app-logs-pvc"
        accessModes:
          - ReadWriteMany
        storageClassName: "efs-sc"
        storage: "5Gi"
        mountPath: "/app/logs"
        selector:
          volumeName: "alpha-tertiary-project-game-app-logs-pv"
      - name: "alpha-tertiary-project-game-app-version-pvc"
        accessModes:
          - ReadWriteMany
        storageClassName: "efs-sc"
        storage: "5Gi"
        mountPath: "/app/version"
        selector:
          volumeName: "alpha-tertiary-project-game-app-version-pv"
