# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 2
# version: "ca550a77"

# Environment setting - automatically injects ENVIRONMENT variable to both main container and init containers
# Example: environment: "staging" will add ENVIRONMENT="staging" to container env vars
environment: "dev"

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: harbor.example.com/example-project/game
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "b4482c5f"

imageCredentials:
  enabled: false
  registry: https://harbor.example.com
  username: robot$example
  password: <HARBOR_ROBOT_TOKEN>
  name: harbor-robot-secret

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets:
  - name: harbor-robot-secret
# This is to override the chart name.
nameOverride: "dev-example-project-game"
fullnameOverride: "dev-example-project-game"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations:
  filebeat/logs: "true"
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
  targetPort: 8080

# Ingress disabled after Phase 6 cutover (2026-04-17) — NGF owns .56 via ngf-public-a Gateway.
# Legacy fields retained for rollback reference; re-enable only if NGF path is reverted.
ingress:
  enabled: false
  className: "nginx-public-a"
  annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false" # Disable SSL redirection
    nginx.ingress.kubernetes.io/ssl-passthrough: "false" # Disable SSL passthrough
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: dev-game.pm.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: external.example.com  # secondary host
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Gateway API HTTPRoute — sole traffic path after Phase 6 cutover (2026-04-17, .56 swap complete).
# The legacy Ingress `rewrite-target: /` with path:
# sectionName omitted → auto-attach to both HTTP and HTTPS listeners.
# backendRefs omitted → chart auto-wires to the release's Service at service.port.
httproute:
  enabled: true
  parentRefs:
    - name: ngf-public-a
      namespace: nginx-gateway
  hostnames:
    - dev-game.pm.example.com
    - external.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

revisionHistoryLimit: 1

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

strategy:
  enabled: true
  config:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # Maximum number of pods that can be created above the desired number of pods
      maxUnavailable: "50%" # Maximum number of unavailable pods during the update

# Probe order: Startup → (Liveness + Readiness in parallel)
# Startup succeeds → Liveness/Readiness start. Startup fails → container restarts (no Liveness/Readiness runs).
# Liveness fails → container restarts. Readiness fails → traffic blocked (no restart).
#
# Why Startup Probe:
# 1. Prevents restart loop during slow init (NFS mount + data loading)
#    → Without it, Liveness fires before app is ready → kill → reload → kill (infinite loop)
# 2. Blocks user traffic until fully ready
#    �� Startup pass → Readiness pass → then Pod joins Service Endpoint → users connect
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5   # Wait before first probe after container start
  periodSeconds: 5          # Interval between probes
  failureThreshold: 30      # 5s × 30 = max 150s wait (NFS mount delay)
  timeoutSeconds: 3          # Max wait for probe response

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10   # Wait after Startup Probe succeeds
  periodSeconds: 10          # Check every 10s (lower frequency = less overhead)
  timeoutSeconds: 3          # Max wait for probe response
  failureThreshold: 3        # 3 consecutive failures → restart container

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5    # Start checking readiness quickly after Startup Probe
  periodSeconds: 5           # Check every 5s (higher frequency for traffic-sensitive routing)
  timeoutSeconds: 3          # Max wait for probe response
  failureThreshold: 3        # 3 consecutive failures → remove from Service Endpoint

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

rbac:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

envConfig: {}
  # NODE_ENV: base

configs:
  enabled: true
  items:
    - name: dev-game-app-config
      datas:
        NODE_ENV: dev
        SERVER_PORT: 8080
        ALLOW_JSON_CONTENT_TYPE: false

        # pub/sup Redis
        REDIS_HOST: dev-example-project-redis.example-project-db-redis.svc.example-cluster.local
        REDIS_PORT: 6379
        REDIS_NUMBER: 0

        # Session Redis
        # SESSION_REDIS_HOST: example-project-redis-cluster-client.example-project-db-redis.svc.example-cluster.local
        SESSION_REDIS_HOST: dev-example-project-redis.example-project-db-redis.svc.example-cluster.local
        SESSION_REDIS_PORT: 6379
        SESSION_REDIS_NUMBER: 0
        SESSION_REDIS_CLUSTER_MODE: false
        SESSION_REDIS_TTL: 3600

        # User Level Lock redis
        USER_LEVEL_LOCK_ENABLED: true
        RED_LOCK_REDIS_HOST: dev-example-project-redis.example-project-db-redis.svc.example-cluster.local
        RED_LOCK_REDIS_PORT: 6379
        RED_LOCK_REDIS_NUMBER: 0
        RED_LOCK_REDIS_CLUSTER_MODE: false

        DB_CONNECTION_LIMIT: 300

        COMMON_DB_TYPE: mysql
        COMMON_DB_HOST: example-project-db.example-project-db-redis.svc.example-cluster.local
        # COMMON_DB_HOST: example-cluster.example.com
        COMMON_DB_PORT: 3306
        # COMMON_DB_PORT: 30636
        COMMON_DB_NAME: common
        COMMON_DB_DATABASE: dev_common
        COMMON_DB_USER: example-project
        COMMON_DB_PASSWORD: exampleAdminPassword
        GAME_DB_TYPE: mysql
        GAME_DB_HOST: example-project-db.example-project-db-redis.svc.example-cluster.local
        # GAME_DB_HOST: example-cluster.example.com
        GAME_DB_PORT: 3306
        # GAME_DB_PORT: 30636
        GAME_DB_NAME: game
        GAME_DB_DATABASE: dev_game
        GAME_DB_USER: example-project
        GAME_DB_PASSWORD: exampleAdminPassword
        CHECK_RESOURCE_VERSION: true
        CHECK_LUA_VERSION: true
        CHECK_REQUEST_SEQUENCE: false
        BATTLE_SERVER_URL: http://dev-example-project-battle.dev-example-project.svc.example-cluster.local  # <svc.name>.<namespace>.svc.<cluster_dns>; current cluster DNS = example-cluster.local

# Init Containers Setting
initContainers:
  enabled: false

emptyDirVolumes:
  enabled: false

persistentVolumes:
  enabled: true
  items:
    - name: dev-example-project-game-app-data-pv
      storage: 5Gi
      volumeMode: Filesystem
      accessModes:
        - ReadWriteMany
      reclaimPolicy: Retain
      storageClassName: nfs-client-nopath
      path: /volume1/nfs/example-project/dev/server/data
      server: 192.168.1.5
    - name: dev-example-project-game-app-logs-pv
      storage: 5Gi
      volumeMode: Filesystem
      accessModes:
        - ReadWriteMany
      reclaimPolicy: Retain
      storageClassName: nfs-client-nopath
      path: /volume1/nfs/example-project/dev/server/logs/
      server: 192.168.1.5
    - name: dev-example-project-game-app-version-pv
      storage: 5Gi
      volumeMode: Filesystem
      accessModes:
        - ReadWriteMany
      reclaimPolicy: Retain
      storageClassName: nfs-client-nopath
      path: /volume1/nfs/example-project/dev/server/version
      server: 192.168.1.5

persistentVolumeClaims:
  enabled: true
  items:
    - name: dev-example-project-game-app-data-pvc
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nopath
      storage: 5Gi
      mountPath: /app/data
      selector:
        volumeName: dev-example-project-game-app-data-pv
    - name: dev-example-project-game-app-logs-pvc
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nopath
      storage: 5Gi
      mountPath: /app/logs
      selector:
        volumeName: dev-example-project-game-app-logs-pv
    - name: dev-example-project-game-app-version-pvc
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nopath
      storage: 5Gi
      mountPath: /app/version
      selector:
        volumeName: dev-example-project-game-app-version-pv

# Extra volumes to add to the deployment
extraVolumes: []

# Extra volume mounts to add to the container
extraVolumeMounts: []

# AWS
certificate:
  enabled: false

certCleanup:
  enabled: false
